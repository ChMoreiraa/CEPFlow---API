services:
  api:
    build: .
    container_name: cepflow-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: python:3.12-slim
    container_name: cepflow-frontend
    working_dir: /site
    volumes:
      - ./frontend:/site
    command: python -m http.server 8080
    ports:
      - "8080:8080"
    depends_on:
      - api
